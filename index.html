<script>

/* ============================================================
   Breeze-ASR-26 ONNX
   ============================================================ */

const MODEL_BASE_URL =
"https://huggingface.co/weemed/Breeze-ASR-26-ONNX/resolve/main/";


const ENCODER_URL =
MODEL_BASE_URL +
"breeze-asr-26-large-v2-encoder.int8.onnx";


const DECODER_URL =
MODEL_BASE_URL +
"breeze-asr-26-large-v2-decoder.int8.onnx";


const TOKENS_URL =
MODEL_BASE_URL +
"breeze-asr-26-large-v2-tokens.txt";


/* ============================================================
   Emscripten Module
   ============================================================ */

var Module = {

  locateFile: function(path) {

    console.log(
      "locateFile:",
      path
    );

    return "./assets/" + path;
  },

  print: function(text) {

    console.log(
      "[WASM]",
      text
    );
  },

  printErr: function(text) {

    console.error(
      "[WASM]",
      text
    );
  },

  onAbort: function(reason) {

    console.error(
      "WASM ABORT:",
      reason
    );
  }

};


/* ============================================================
   State
   ============================================================ */

let wasmModule = null;

let recognizer = null;

let asrApiLoaded = false;

let loading = false;

let isRecording = false;

let audioContext = null;

let mediaStream = null;

let sourceNode = null;

let processor = null;

let gainNode = null;

let audioStream = null;


/* ============================================================
   DOM
   ============================================================ */

const loadBtn =
document.getElementById("loadBtn");

const recordBtn =
document.getElementById("recordBtn");

const clearBtn =
document.getElementById("clearBtn");

const statusElement =
document.getElementById("status");

const outputElement =
document.getElementById("output");

const progressBox =
document.getElementById("progressBox");

const progressTitle =
document.getElementById("progressTitle");

const progressBar =
document.getElementById("progressBar");

const progressText =
document.getElementById("progressText");

const debugElement =
document.getElementById("debug");


/* ============================================================
   Helpers
   ============================================================ */

function setStatus(text) {

  statusElement.textContent =
    text;
}


function debug(text) {

  console.log(text);

  debugElement.textContent +=
    String(text) + "\n";

  debugElement.scrollTop =
    debugElement.scrollHeight;
}


function formatBytes(bytes) {

  if (
    !Number.isFinite(bytes) ||
    bytes <= 0
  ) {

    return "0 B";
  }

  const units = [
    "B",
    "KB",
    "MB",
    "GB"
  ];

  const i =
    Math.min(
      units.length - 1,
      Math.floor(
        Math.log(bytes) /
        Math.log(1024)
      )
    );

  return (
    bytes /
    Math.pow(1024, i)
  ).toFixed(
    i === 0 ? 0 : 2
  ) +
  " " +
  units[i];
}


function setProgress(
  percent,
  title,
  detail
) {

  progressBox.style.display =
    "block";

  if (
    title !== undefined
  ) {

    progressTitle.textContent =
      title;
  }

  const p =
    Math.max(
      0,
      Math.min(
        100,
        percent
      )
    );

  progressBar.style.width =
    p + "%";

  if (
    detail !== undefined
  ) {

    progressText.textContent =
      detail;

  } else {

    progressText.textContent =
      Math.round(p) + "%";
  }
}


function hideProgress() {

  progressBox.style.display =
    "none";
}


/* ============================================================
   WASM initialization
   ============================================================ */

async function initializeWasm() {

  if (wasmModule) {

    debug(
      "WASM 已經初始化"
    );

    return wasmModule;
  }

  setStatus(
    "正在初始化 sherpa-onnx WASM..."
  );

  debug(
    "window.SherpaOnnx = " +
    typeof window.SherpaOnnx
  );

  if (
    typeof window.SherpaOnnx !==
    "function"
  ) {

    throw new Error(
      "找不到 window.SherpaOnnx。請確認 assets/sherpa-onnx-wasm-web.js 已正確部署。"
    );
  }

  debug(
    "找到 window.SherpaOnnx factory"
  );

  wasmModule =
    await window.SherpaOnnx(Module);

  if (!wasmModule) {

    throw new Error(
      "SherpaOnnx(Module) 沒有返回 WASM Module。"
    );
  }

  debug(
    "Emscripten Module 初始化完成"
  );

  if (!wasmModule.FS) {

    throw new Error(
      "WASM 初始化成功，但沒有提供 FS。"
    );
  }

  if (
    typeof wasmModule.FS.writeFile !==
    "function"
  ) {

    throw new Error(
      "WASM 初始化成功，但找不到 FS.writeFile。"
    );
  }

  debug(
    "OK：wasmModule.FS.writeFile"
  );

  return wasmModule;
}


/* ============================================================
   Download file with progress
   ============================================================ */

async function downloadFile(
  url,
  name,
  progressStart,
  progressEnd
) {

  debug(
    "開始下載：" +
    name
  );

  setStatus(
    "正在下載 " +
    name +
    "..."
  );

  setProgress(
    progressStart,
    "下載 " + name,
    "連線中..."
  );

  const response =
    await fetch(
      url,
      {
        method: "GET",
        mode: "cors",
        credentials: "omit",
        cache: "default"
      }
    );

  if (!response.ok) {

    throw new Error(
      name +
      " 下載失敗：" +
      response.status +
      " " +
      response.statusText
    );
  }

  const contentLength =
    response.headers.get(
      "content-length"
    );

  const total =
    contentLength
      ? parseInt(
          contentLength,
          10
        )
      : 0;

  debug(
    name +
    " Content-Length = " +
    (
      total
        ? formatBytes(total)
        : "未知"
    )
  );

  if (!response.body) {

    const buffer =
      await response.arrayBuffer();

    const data =
      new Uint8Array(buffer);

    setProgress(
      progressEnd,
      "下載 " + name,
      "完成 · " +
      formatBytes(
        data.byteLength
      )
    );

    return data;
  }

  const reader =
    response.body.getReader();

  const chunks = [];

  let received = 0;

  while (true) {

    const result =
      await reader.read();

    if (result.done) {
      break;
    }

    if (!result.value) {
      continue;
    }

    chunks.push(
      result.value
    );

    received +=
      result.value.byteLength;

    let localPercent = 0;

    if (total > 0) {

      localPercent =
        received /
        total *
        100;
    }

    const overallPercent =
      progressStart +
      (
        localPercent / 100
      ) *
      (
        progressEnd -
        progressStart
      );

    if (total > 0) {

      setProgress(
        overallPercent,
        "下載 " + name,
        Math.round(
          localPercent
        ) +
        "% · " +
        formatBytes(
          received
        ) +
        " / " +
        formatBytes(
          total
        )
      );

    } else {

      setProgress(
        progressStart,
        "下載 " + name,
        "已下載 " +
        formatBytes(
          received
        )
      );
    }
  }

  const data =
    new Uint8Array(
      received
    );

  let offset = 0;

  for (
    const chunk of chunks
  ) {

    data.set(
      chunk,
      offset
    );

    offset +=
      chunk.byteLength;
  }

  setProgress(
    progressEnd,
    "下載 " + name,
    "完成 · " +
    formatBytes(
      data.byteLength
    )
  );

  debug(
    "下載完成：" +
    name +
    " (" +
    formatBytes(
      data.byteLength
    ) +
    ")"
  );

  return data;
}


/* ============================================================
   Write file to Emscripten FS
   ============================================================ */

function writeWasmFile(
  path,
  data
) {

  if (!wasmModule) {

    throw new Error(
      "WASM Module 不存在。"
    );
  }

  if (
    !wasmModule.FS ||
    typeof wasmModule.FS.writeFile !==
      "function"
  ) {

    throw new Error(
      "WASM FS.writeFile 不存在。"
    );
  }

  try {

    wasmModule.FS.unlink(
      path
    );

  } catch (_) {}

  wasmModule.FS.writeFile(
    path,
    data
  );

  debug(
    "FS.writeFile OK: " +
    path
  );
}


/* ============================================================
   Load sherpa-onnx ASR API
   ============================================================ */

async function loadAsrApi() {

  if (
    asrApiLoaded &&
    typeof OfflineRecognizer ===
      "function"
  ) {

    debug(
      "OfflineRecognizer 已存在"
    );

    return;
  }

  if (
    typeof OfflineRecognizer ===
      "function"
  ) {

    asrApiLoaded =
      true;

    debug(
      "OfflineRecognizer 已存在"
    );

    return;
  }

  debug(
    "載入 sherpa-onnx-asr.js..."
  );

  await new Promise(
    function(resolve, reject) {

      const script =
        document.createElement(
          "script"
        );

      script.src =
        "./assets/sherpa-onnx-asr.js";

      script.async =
        false;

      script.onload =
        function() {

          debug(
            "sherpa-onnx-asr.js 載入完成"
          );

          resolve();
        };

      script.onerror =
        function() {

          reject(
            new Error(
              "無法載入 sherpa-onnx-asr.js"
            )
          );
        };

      document.head.appendChild(
        script
      );
    }
  );

  if (
    typeof OfflineRecognizer !==
    "function"
  ) {

    throw new Error(
      "sherpa-onnx-asr.js 已載入，但找不到 OfflineRecognizer。"
    );
  }

  asrApiLoaded =
    true;

  debug(
    "OfflineRecognizer OK"
  );
}


/* ============================================================
   Create Breeze recognizer
   ============================================================ */

function createRecognizer() {

  debug(
    "建立 Breeze-ASR-26 recognizer..."
  );

  const config = {

    featConfig: {

      sampleRate:
        16000,

      featureDim:
        80
    },

    modelConfig: {

      tokens:
        "./breeze-tokens.txt",

      numThreads:
        1,

      provider:
        "cpu",

      debug:
        0,

      whisper: {

        encoder:
          "./breeze-encoder.int8.onnx",

        decoder:
          "./breeze-decoder.int8.onnx",

        language:
          "zh",

        task:
          "transcribe"
      }
    },

    decodingMethod:
      "greedy_search"
  };

  debug(
    "Breeze config:\n" +
    JSON.stringify(
      config,
      null,
      2
    )
  );

  recognizer =
    new OfflineRecognizer(
      config,
      wasmModule
    );

  if (!recognizer) {

    throw new Error(
      "OfflineRecognizer 建立失敗。"
    );
  }

  debug(
    "Breeze recognizer 建立完成"
  );
}


/* ============================================================
   Load model
   ============================================================ */

async function loadModel() {

  if (loading) {
    return;
  }

  if (recognizer) {

    setStatus(
      "模型已經載入，可以開始說話。"
    );

    recordBtn.disabled =
      false;

    return;
  }

  loading =
    true;

  loadBtn.disabled =
    true;

  recordBtn.disabled =
    true;

  progressBox.style.display =
    "block";

  try {

    debug(
      "================================"
    );

    debug(
      "開始載入 Breeze-ASR-26"
    );

    debug(
      "================================"
    );


    /* --------------------------------------------------------
       1. WASM
       -------------------------------------------------------- */

    await initializeWasm();


    /* --------------------------------------------------------
       2. ASR API
       -------------------------------------------------------- */

    await loadAsrApi();


    /* --------------------------------------------------------
       3. Encoder
       -------------------------------------------------------- */

    const encoderData =
      await downloadFile(
        ENCODER_URL,
        "Encoder",
        0,
        50
      );


    /* --------------------------------------------------------
       4. Decoder
       -------------------------------------------------------- */

    const decoderData =
      await downloadFile(
        DECODER_URL,
        "Decoder",
        50,
        90
      );


    /* --------------------------------------------------------
       5. Tokens
       -------------------------------------------------------- */

    const tokensData =
      await downloadFile(
        TOKENS_URL,
        "Tokens",
        90,
        100
      );


    /* --------------------------------------------------------
       6. Write FS
       -------------------------------------------------------- */

    setStatus(
      "正在將模型寫入 WASM..."
    );

    setProgress(
      100,
      "準備模型",
      "寫入 Encoder..."
    );

    writeWasmFile(
      "/breeze-encoder.int8.onnx",
      encoderData
    );

    setProgress(
      100,
      "準備模型",
      "寫入 Decoder..."
    );

    writeWasmFile(
      "/breeze-decoder.int8.onnx",
      decoderData
    );

    setProgress(
      100,
      "準備模型",
      "寫入 Tokens..."
    );

    writeWasmFile(
      "/breeze-tokens.txt",
      tokensData
    );


    debug(
      "Encoder / Decoder / Tokens 已寫入 WASM FS"
    );


    /* --------------------------------------------------------
       7. Create recognizer
       -------------------------------------------------------- */

    setStatus(
      "正在建立 Breeze-ASR-26 辨識器..."
    );

    createRecognizer();


    /* --------------------------------------------------------
       8. Ready
       -------------------------------------------------------- */

    setProgress(
      100,
      "模型完成",
      "Breeze-ASR-26 已準備完成"
    );

    setStatus(
      "✅ Breeze-ASR-26 已載入，可以開始說話。"
    );

    recordBtn.disabled =
      false;

    loadBtn.textContent =
      "① 模型已載入";

    debug(
      "================================"
    );

    debug(
      "Breeze-ASR-26 READY"
    );

    debug(
      "================================"
    );


  } catch (error) {

    console.error(
      "MODEL LOAD ERROR:",
      error
    );

    debug(
      "模型載入錯誤：\n" +
      (
        error &&
        error.stack
          ? error.stack
          : String(error)
      )
    );

    recognizer =
      null;

    loadBtn.disabled =
      false;

    recordBtn.disabled =
      true;

    setProgress(
      0,
      "載入失敗",
      ""
    );

    setStatus(
      "❌ 模型載入失敗：\n" +
      (
        error &&
        error.message
          ? error.message
          : String(error)
      )
    );

  } finally {

    loading =
      false;
  }
}


/* ============================================================
   Start recording
   ============================================================ */

async function startRecording() {

  if (!recognizer) {

    setStatus(
      "請先載入模型。"
    );

    return;
  }

  if (isRecording) {
    return;
  }

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    setStatus(
      "此瀏覽器不支援麥克風。"
    );

    return;
  }

  try {

    debug(
      "請求麥克風權限..."
    );

    mediaStream =
      await navigator.mediaDevices.getUserMedia(
        {
          audio: {
            channelCount: 1,
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          }
        }
      );

    debug(
      "麥克風權限取得"
    );


    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();


    if (
      audioContext.state ===
      "suspended"
    ) {

      await audioContext.resume();
    }


    debug(
      "AudioContext sampleRate = " +
      audioContext.sampleRate
    );


    sourceNode =
      audioContext.createMediaStreamSource(
        mediaStream
      );


    processor =
      audioContext.createScriptProcessor(
        4096,
        1,
        1
      );


    gainNode =
      audioContext.createGain();

    gainNode.gain.value =
      0;


    audioStream =
      recognizer.createStream();


    if (!audioStream) {

      throw new Error(
        "無法建立 OfflineStream。"
      );
    }


    processor.onaudioprocess =
      function(event) {

        if (
          !isRecording ||
          !audioStream
        ) {

          return;
        }


        const input =
          event.inputBuffer
            .getChannelData(0);


        const samples =
          new Float32Array(
            input.length
          );


        samples.set(
          input
        );


        audioStream.acceptWaveform(
          audioContext.sampleRate,
          samples
        );
      };


    sourceNode.connect(
      processor
    );

    processor.connect(
      gainNode
    );

    gainNode.connect(
      audioContext.destination
    );


    isRecording =
      true;


    recordBtn.textContent =
      "③ 停止並辨識";

    recordBtn.style.background =
      "#16a34a";


    setStatus(
      "🔴 正在錄音，請開始說話..."
    );


    debug(
      "錄音開始"
    );

  } catch (error) {

    console.error(
      "MIC ERROR:",
      error
    );

    debug(
      "麥克風錯誤：\n" +
      (
        error &&
        error.stack
          ? error.stack
          : String(error)
      )
    );

    setStatus(
      "❌ 無法使用麥克風：\n" +
      (
        error &&
        error.message
          ? error.message
          : String(error)
      )
    );

    cleanupAudio();
  }
}


/* ============================================================
   Stop recording
   ============================================================ */

async function stopRecording() {

  if (!isRecording) {
    return;
  }

  isRecording =
    false;

  recordBtn.disabled =
    true;

  recordBtn.textContent =
    "辨識中...";

  recordBtn.style.background =
    "#dc2626";


  setStatus(
    "⏳ 正在辨識..."
  );


  debug(
    "停止錄音，開始 decode..."
  );


  try {

    if (processor) {

      processor.onaudioprocess =
        null;
    }


    /*
     * 先停止麥克風，
     * 但 audioStream 保留到 decode 完成。
     */

    if (mediaStream) {

      mediaStream
        .getTracks()
        .forEach(
          function(track) {

            track.stop();

          }
        );
    }


    if (
      audioStream &&
      typeof audioStream.inputFinished ===
        "function"
    ) {

      audioStream.inputFinished();

      debug(
        "audioStream.inputFinished()"
      );
    }


    /*
     * 等待 WASM 解碼。
     */

    await Promise.resolve(
      recognizer.decode(
        audioStream
      )
    );


    debug(
      "decode 完成"
    );


    const result =
      recognizer.getResult(
        audioStream
      );


    debug(
      "辨識結果：\n" +
      JSON.stringify(
        result,
        null,
        2
      )
    );


    const text =
      result &&
      typeof result.text ===
        "string"
        ? result.text.trim()
        : "";


    /*
     * Breeze 本身直接輸出繁體中文。
     *
     * 不使用 OpenCC。
     */

    outputElement.value =
      text;


    if (text) {

      setStatus(
        "✅ 辨識完成"
      );

    } else {

      setStatus(
        "⚠️ 沒有辨識到文字"
      );
    }


  } catch (error) {

    console.error(
      "RECOGNITION ERROR:",
      error
    );

    debug(
      "辨識錯誤：\n" +
      (
        error &&
        error.stack
          ? error.stack
          : String(error)
      )
    );

    setStatus(
      "❌ 辨識失敗：\n" +
      (
        error &&
        error.message
          ? error.message
          : String(error)
      )
    );

  } finally {

    /*
     * audioStream 在 decode 完成後才清掉。
     */

    if (audioStream) {

      try {

        if (
          typeof audioStream.free ===
            "function"
        ) {

          audioStream.free();
        }

      } catch (_) {}
    }

    cleanupAudio();

    recordBtn.disabled =
      false;

    recordBtn.textContent =
      "② 開始說話";

    recordBtn.style.background =
      "#dc2626";
  }
}


/* ============================================================
   Cleanup audio
   ============================================================ */

function cleanupAudio() {

  debug(
    "清理音訊資源..."
  );


  if (processor) {

    try {
      processor.disconnect();
    } catch (_) {}

    processor =
      null;
  }


  if (sourceNode) {

    try {
      sourceNode.disconnect();
    } catch (_) {}

    sourceNode =
      null;
  }


  if (gainNode) {

    try {
      gainNode.disconnect();
    } catch (_) {}

    gainNode =
      null;
  }


  if (mediaStream) {

    try {

      mediaStream
        .getTracks()
        .forEach(
          function(track) {

            try {
              track.stop();
            } catch (_) {}

          }
        );

    } catch (_) {}

    mediaStream =
      null;
  }


  if (audioContext) {

    try {

      audioContext.close();

    } catch (_) {}

    audioContext =
      null;
  }


  audioStream =
    null;


  debug(
    "音訊資源清理完成"
  );
}


/* ============================================================
   Buttons
   ============================================================ */

loadBtn.addEventListener(
  "click",
  function(event) {

    /*
     * 防止任何預設行為造成頁面重新整理。
     */

    if (event) {
      event.preventDefault();
    }

    loadModel();
  }
);


recordBtn.addEventListener(
  "click",
  async function(event) {

    if (event) {
      event.preventDefault();
    }

    if (isRecording) {

      await stopRecording();

    } else {

      await startRecording();
    }
  }
);


clearBtn.addEventListener(
  "click",
  function(event) {

    if (event) {
      event.preventDefault();
    }

    outputElement.value =
      "";

    setStatus(
      recognizer
        ? "模型已載入，可以開始說話。"
        : "尚未載入模型，請按「① 載入模型」。"
    );

    debug(
      "文字已清除"
    );
  }
);


/* ============================================================
   Prevent accidental form-like submit/reload
   ============================================================ */

window.addEventListener(
  "beforeunload",
  function() {

    if (isRecording) {

      try {
        cleanupAudio();
      } catch (_) {}

    }
  }
);

   Startup
   ============================================================ */

debug(
  "================================"
);

debug(
  "頁面載入完成"
);

debug(
  "Breeze-ASR-26 ONNX"
);

debug(
  "================================"
);

debug(
  "Encoder URL:"
);

debug(
  ENCODER_URL
);

debug(
  "Decoder URL:"
);

debug(
  DECODER_URL
);

debug(
  "Tokens URL:"
);

debug(
  TOKENS_URL
);

debug(
  "SherpaOnnx: " +
  typeof window.SherpaOnnx
);

debug(
  "ASR API 尚未載入"
);

setStatus(
  "尚未載入模型，請按「① 載入模型」。"
);

</script>
